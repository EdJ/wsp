<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1340" width="1240" height="1340" role="img" aria-labelledby="t d">
  <title id="t">The agent manager: the conceptual split between compound, wsp and each agent host</title>
  <desc id="d">Top panel: the target. A person's machine runs compound's UI, compound's host and the wsp CLI. The server (the wsp daemon until it exists) holds the store. Each agent host runs one agent manager, which supervises one compound-sup per seat, the agents and their trees, the gate and tree jobs. Bottom panel: what crosses the boundary today and is removed.</desc>
  <style>
    svg { --bg:#ffffff; --fg:#1f2328; --muted:#57606a; --box:#f6f8fa; --edge:#57606a; --host:#8c959f; --mgr:#ddf4ff; --mgr-edge:#0969da; --gone:#cf222e; --gone-box:#ffebe9; --stay:#8c959f; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --box:#161b22; --edge:#9198a1; --host:#6e7681; --mgr:#0c2d6b; --mgr-edge:#4493f8; --gone:#f85149; --gone-box:#3d1214; --stay:#7d8590; }
    }
    .bg { fill: var(--bg); }
    .host { fill: none; stroke: var(--host); stroke-width: 1.5; stroke-dasharray: 6 4; }
    .host-shadow { fill: none; stroke: var(--host); stroke-width: 1; stroke-dasharray: 2 4; }
    .box { fill: var(--box); stroke: var(--edge); stroke-width: 1.2; }
    .mgr { fill: var(--mgr); stroke: var(--mgr-edge); stroke-width: 2; }
    .gone-box { fill: var(--gone-box); stroke: var(--gone); stroke-width: 1.2; stroke-dasharray: 5 3; }
    .stay-box { fill: var(--box); stroke: var(--stay); stroke-width: 1.2; stroke-dasharray: 5 3; }
    .line { stroke: var(--edge); stroke-width: 1.5; fill: none; }
    .proto { stroke: var(--mgr-edge); stroke-width: 2.5; fill: none; }
    .dayone { stroke: var(--edge); stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
    .gone { stroke: var(--gone); stroke-width: 1.5; fill: none; stroke-dasharray: 5 3; }
    .stay { stroke: var(--stay); stroke-width: 1.5; fill: none; stroke-dasharray: 5 3; }
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--fg); }
    .h1 { font-size: 20px; font-weight: 600; }
    .hl { font-size: 13px; font-weight: 600; fill: var(--muted); }
    .t { font-size: 14px; font-weight: 600; }
    .s { font-size: 11.5px; fill: var(--muted); }
    .l { font-size: 11px; fill: var(--muted); font-style: italic; }
    .lp { font-size: 11.5px; fill: var(--mgr-edge); font-weight: 600; }
    .g { font-size: 12px; }
    .ah { fill: var(--edge); }
    .ap { fill: var(--mgr-edge); }
    .ag { fill: var(--gone); }
    .as { fill: var(--stay); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ap"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ag"/></marker>
    <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="as"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1240" height="1340"/>

  <!-- ============ Panel 1: the target ============ -->
  <text class="h1" x="20" y="40">The target: each agent host behind its own manager</text>

  <!-- A person's machine -->
  <rect class="host" x="20" y="70" width="340" height="300" rx="10"/>
  <text class="hl" x="32" y="91">A person's machine</text>

  <rect class="box" x="40" y="105" width="300" height="45" rx="6"/>
  <text class="t" x="190" y="125" text-anchor="middle">compound's UI</text>
  <text class="s" x="190" y="141" text-anchor="middle">its windows (compound-ui)</text>

  <rect class="box" x="40" y="180" width="300" height="50" rx="6"/>
  <text class="t" x="190" y="200" text-anchor="middle">compound's host</text>
  <text class="s" x="190" y="217" text-anchor="middle">host-core: request → store → select</text>

  <rect class="box" x="120" y="265" width="220" height="50" rx="6"/>
  <text class="t" x="230" y="285" text-anchor="middle">wsp CLI</text>
  <text class="s" x="230" y="302" text-anchor="middle">a person's verbs</text>

  <line class="line" x1="190" y1="150" x2="190" y2="180" marker-end="url(#a)" marker-start="url(#a)"/>
  <text class="l" x="198" y="169">compound's own</text>

  <!-- The server -->
  <rect class="host" x="420" y="70" width="800" height="300" rx="10"/>
  <text class="hl" x="432" y="91">The server (D8: not on a person's machine or an agent host)</text>

  <rect class="box" x="440" y="105" width="400" height="95" rx="6"/>
  <text class="t" x="640" y="128" text-anchor="middle">wsp daemon now → wsp server later</text>
  <text class="s" x="640" y="147" text-anchor="middle">decides: cycle, ending, orders, held tells, placement</text>
  <text class="s" x="640" y="163" text-anchor="middle">folds host events; no ps, lsof, renders or transcripts</text>
  <text class="s" x="640" y="179" text-anchor="middle">until the server exists, the daemon runs on the Mac</text>

  <rect class="box" x="880" y="105" width="320" height="95" rx="6"/>
  <text class="t" x="1040" y="128" text-anchor="middle">the store</text>
  <text class="s" x="1040" y="147" text-anchor="middle">~/wsp and its state files now</text>
  <text class="s" x="1040" y="163" text-anchor="middle">SQLite behind the store contract later</text>

  <line class="line" x1="840" y1="160" x2="880" y2="160" marker-end="url(#a)" marker-start="url(#a)"/>

  <!-- person's machine to the server -->
  <line class="line" x1="340" y1="205" x2="440" y2="172" marker-end="url(#a)" marker-start="url(#a)"/>
  <line class="line" x1="340" y1="290" x2="440" y2="190" marker-end="url(#a)"/>
  <text class="l" x="452" y="226">← the wsp API, network (D19):</text>
  <text class="l" x="452" y="240">compound's host subscribes,</text>
  <text class="l" x="452" y="254">the CLI sends verbs</text>

  <!-- the host protocol -->
  <line class="proto" x1="640" y1="200" x2="640" y2="460" marker-end="url(#ap)" marker-start="url(#ap)"/>
  <text class="lp" x="652" y="296">the host protocol: TCP, one JSON message per line</text>
  <text class="lp" x="652" y="312">hello · seat.* · order.* · job.* · beat every 10 s · events from id</text>
  <text class="lp" x="652" y="328">the same path for the Mac as for the i5</text>
  <text class="lp" x="652" y="344">day one: the daemon and the CLI dial each manager</text>

  <!-- An agent host (one of several) -->
  <rect class="host-shadow" x="30" y="430" width="1200" height="300" rx="10"/>
  <rect class="host" x="20" y="420" width="1200" height="300" rx="10"/>
  <text class="hl" x="90" y="441">An agent host: the Mac, the i5, …</text>

  <rect class="box" x="40" y="465" width="260" height="50" rx="6"/>
  <text class="t" x="170" y="485" text-anchor="middle">compound-render</text>
  <text class="s" x="170" y="502" text-anchor="middle">when a window watches the seat</text>

  <rect class="mgr" x="440" y="460" width="400" height="85" rx="8"/>
  <text class="t" x="640" y="483" text-anchor="middle">the agent manager</text>
  <text class="s" x="640" y="500" text-anchor="middle">one per host, kept running by launchd</text>
  <text class="s" x="640" y="516" text-anchor="middle">seat table · journal · tree jobs · host facts · hooks</text>
  <text class="s" x="640" y="532" text-anchor="middle">fenced by idempotency keys and seat epochs</text>

  <rect class="box" x="900" y="460" width="300" height="55" rx="6"/>
  <text class="t" x="1050" y="481" text-anchor="middle">the agents' own wsp calls</text>
  <text class="s" x="1050" y="498" text-anchor="middle">say, note, review, submit, the brief</text>

  <rect class="box" x="40" y="610" width="260" height="65" rx="6"/>
  <text class="t" x="170" y="632" text-anchor="middle">compound-sup × N</text>
  <text class="s" x="170" y="649" text-anchor="middle">one per seat, durable (setsid)</text>
  <text class="s" x="170" y="664" text-anchor="middle">the pty, deliver and ack</text>

  <rect class="box" x="400" y="610" width="280" height="65" rx="6"/>
  <text class="t" x="540" y="632" text-anchor="middle">the agents and their trees</text>
  <text class="s" x="540" y="649" text-anchor="middle">claude, opencode; one tree per row</text>
  <text class="s" x="540" y="664" text-anchor="middle">transcripts stay on this host</text>

  <rect class="box" x="740" y="610" width="210" height="65" rx="6"/>
  <text class="t" x="845" y="632" text-anchor="middle">compound-remote gate</text>
  <text class="s" x="845" y="649" text-anchor="middle">a PreToolUse hook that holds</text>
  <text class="s" x="845" y="664" text-anchor="middle">tool calls past the lease</text>

  <rect class="box" x="980" y="610" width="220" height="65" rx="6"/>
  <text class="t" x="1090" y="632" text-anchor="middle">tree jobs</text>
  <text class="s" x="1090" y="649" text-anchor="middle">check, build, verify</text>
  <text class="s" x="1090" y="664" text-anchor="middle">checkout and land if T2 (Q6)</text>

  <!-- lines inside and into the agent host -->
  <line class="line" x1="70" y1="230" x2="70" y2="465" marker-end="url(#a)" marker-start="url(#a)"/>
  <text class="l" x="78" y="398">render socket</text>
  <text class="l" x="78" y="411">(attach)</text>

  <line class="dayone" x1="230" y1="315" x2="440" y2="482" marker-end="url(#a)"/>
  <text class="l" x="350" y="392">day one: the CLI dials managers too</text>

  <line class="line" x1="170" y1="515" x2="170" y2="610" marker-end="url(#a)" marker-start="url(#a)"/>
  <text class="l" x="162" y="566" text-anchor="end">handoff (pty fd)</text>

  <line class="line" x1="440" y1="530" x2="300" y2="625" marker-end="url(#a)"/>
  <text class="l" x="375" y="590">durable socket: spawn, deliver, close</text>

  <line class="line" x1="300" y1="642" x2="400" y2="642" marker-end="url(#a)" marker-start="url(#a)"/>
  <text class="l" x="350" y="636" text-anchor="middle">pty</text>

  <line class="line" x1="640" y1="610" x2="640" y2="545" marker-end="url(#a)"/>
  <text class="l" x="648" y="572">hooks: turns,</text>
  <text class="l" x="648" y="585">spend, last word</text>

  <line class="line" x1="800" y1="545" x2="845" y2="610" marker-end="url(#a)"/>
  <text class="l" x="830" y="568">lease file</text>
  <text class="l" x="830" y="581">per seat</text>

  <line class="line" x1="740" y1="642" x2="680" y2="642" marker-end="url(#a)"/>
  <text class="l" x="710" y="636" text-anchor="middle">holds</text>

  <line class="line" x1="840" y1="525" x2="1090" y2="610" marker-end="url(#a)"/>
  <text class="l" x="985" y="552">job.run / job.ended</text>

  <polyline class="dayone" points="1050,460 1050,240 840,192" marker-end="url(#a)"/>
  <text class="l" x="1058" y="398">the ssh shim now,</text>
  <text class="l" x="1058" y="411">the wsp API later</text>

  <text class="s" x="32" y="708">Nothing local to a host crosses to wsp except over the host protocol. compound-sup, compound-render and the gate are compound's and unchanged.</text>

  <!-- ============ Panel 2: today ============ -->
  <line class="line" x1="20" y1="760" x2="1220" y2="760" style="stroke-dasharray:1 4"/>
  <text class="h1" x="20" y="795">Today: what crosses the boundary, and is removed</text>

  <rect class="host" x="20" y="810" width="780" height="450" rx="10"/>
  <text class="hl" x="32" y="831">The Mac today: the store, the trees, the agents and wsp, all on one machine</text>

  <rect class="box" x="40" y="850" width="250" height="90" rx="6"/>
  <text class="t" x="165" y="875" text-anchor="middle">wsp CLI and daemon</text>
  <text class="s" x="165" y="893" text-anchor="middle">reach into the host directly</text>
  <text class="s" x="165" y="909" text-anchor="middle">tick p50 19.5 s, p95 116 s</text>
  <text class="s" x="165" y="925" text-anchor="middle">spawn p50 9.4 s</text>

  <rect class="stay-box" x="40" y="1010" width="250" height="70" rx="6"/>
  <text class="t" x="165" y="1032" text-anchor="middle">compound's host</text>
  <text class="s" x="165" y="1050" text-anchor="middle">polls wsp wip --json every 3–4 s</text>
  <text class="s" x="165" y="1066" text-anchor="middle">28,032 calls, 17.2% of CPU a day</text>
  <line class="stay" x1="165" y1="1010" x2="165" y2="940" marker-end="url(#as)"/>
  <text class="l" x="173" y="975">polling: cheap at M1,</text>
  <text class="l" x="173" y="988">gone at state-core step 1</text>

  <g>
    <rect class="gone-box" x="360" y="850" width="420" height="36" rx="5"/>
    <text class="g" x="372" y="873">ps ×37.5 and lsof per tick: ownership read off cwds (wsp-478)</text>
    <rect class="gone-box" x="360" y="898" width="420" height="36" rx="5"/>
    <text class="g" x="372" y="921">kill by pid found through ps: leaked agents, reap, strays</text>
    <rect class="gone-box" x="360" y="946" width="420" height="36" rx="5"/>
    <text class="g" x="372" y="969">screen renders ×59.5 per tick: was the order typed but unsent</text>
    <rect class="gone-box" x="360" y="994" width="420" height="36" rx="5"/>
    <text class="g" x="372" y="1017">hooks.jsonl, said.json, burn.json kept in wsp's own state</text>
    <rect class="gone-box" x="360" y="1042" width="420" height="36" rx="5"/>
    <text class="g" x="372" y="1065">transcripts and opencode's database, read by wsp</text>
    <rect class="gone-box" x="360" y="1090" width="420" height="36" rx="5"/>
    <text class="g" x="372" y="1113">df ×24.6, sysctl, pmset, vm_stat, memory_pressure per tick</text>
    <rect class="gone-box" x="360" y="1138" width="420" height="36" rx="5"/>
    <text class="g" x="372" y="1161">the herdr socket, and 264 herdr references (wsp-120)</text>
    <rect class="gone-box" x="360" y="1186" width="420" height="36" rx="5"/>
    <text class="g" x="372" y="1209">compound-sup forked and signalled by wsp itself</text>
  </g>
  <g>
    <line class="gone" x1="290" y1="880" x2="360" y2="868" marker-end="url(#ag)"/>
    <line class="gone" x1="290" y1="885" x2="360" y2="916" marker-end="url(#ag)"/>
    <line class="gone" x1="290" y1="890" x2="360" y2="964" marker-end="url(#ag)"/>
    <line class="gone" x1="290" y1="895" x2="360" y2="1012" marker-end="url(#ag)"/>
    <line class="gone" x1="290" y1="900" x2="360" y2="1060" marker-end="url(#ag)"/>
    <line class="gone" x1="290" y1="905" x2="360" y2="1108" marker-end="url(#ag)"/>
    <line class="gone" x1="290" y1="910" x2="360" y2="1156" marker-end="url(#ag)"/>
    <line class="gone" x1="290" y1="915" x2="360" y2="1204" marker-end="url(#ag)"/>
  </g>

  <rect class="host" x="830" y="810" width="390" height="450" rx="10"/>
  <text class="hl" x="842" y="831">The i5 today (remote-agents v1)</text>

  <rect class="gone-box" x="850" y="850" width="350" height="50" rx="5"/>
  <text class="g" x="862" y="870">an ssh ControlMaster, plus two forwards</text>
  <text class="g" x="862" y="887">per seat (tunnel.rs)</text>
  <rect class="gone-box" x="850" y="910" width="350" height="50" rx="5"/>
  <text class="g" x="862" y="930">compound-sup started by a shell line</text>
  <text class="g" x="862" y="947">over ssh (far.rs)</text>
  <rect class="gone-box" x="850" y="970" width="350" height="50" rx="5"/>
  <text class="g" x="862" y="990">the beat, paced by the daemon's tick</text>
  <text class="g" x="862" y="1007">(wsp-639: a working seat flaps unreachable)</text>
  <rect class="gone-box" x="850" y="1030" width="350" height="50" rx="5"/>
  <text class="g" x="862" y="1050">the far manifest, a fork per file</text>
  <text class="g" x="862" y="1067">(wsp-638: 4 min 25 s for 8,788 files)</text>
  <rect class="stay-box" x="850" y="1090" width="350" height="50" rx="5"/>
  <text class="g" x="862" y="1110">the shim: the agents' wsp calls over ssh</text>
  <text class="g" x="862" y="1127">(stays until the server's API)</text>
  <rect class="stay-box" x="850" y="1150" width="350" height="50" rx="5"/>
  <text class="g" x="862" y="1170">ssh for install, upgrade and, under T1,</text>
  <text class="g" x="862" y="1187">the tree bytes (stays)</text>
  <text class="s" x="842" y="1240">all of it reached from the Mac's wsp over ssh</text>

  <line class="gone" x1="780" y1="842" x2="850" y2="875" marker-end="url(#ag)"/>

  <!-- Legend -->
  <line class="line" x1="30" y1="1290" x2="80" y2="1290" marker-end="url(#a)"/>
  <text class="s" x="88" y="1294">a channel in the target</text>
  <line class="proto" x1="250" y1="1290" x2="300" y2="1290" marker-end="url(#ap)"/>
  <text class="s" x="308" y="1294">the host protocol</text>
  <line class="gone" x1="440" y1="1290" x2="490" y2="1290" marker-end="url(#ag)"/>
  <text class="s" x="498" y="1294">crosses the boundary today and is removed</text>
  <line class="stay" x1="760" y1="1290" x2="810" y2="1290" marker-end="url(#as)"/>
  <text class="s" x="818" y="1294">stays for now</text>
  <line class="dayone" x1="930" y1="1290" x2="980" y2="1290" marker-end="url(#a)"/>
  <text class="s" x="988" y="1294">day one, before the server</text>
  <text class="s" x="30" y="1322">The Mac is a person's machine and an agent host today. It is drawn as both because nothing in wsp should assume that the two share a machine.</text>
</svg>
