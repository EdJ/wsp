[package]
name = "wsp"
version = "0.1.0"
edition = "2021"
description = "Workspace and task control plane for herdr"

[[bin]]
name = "wsp"
path = "src/main.rs"

[workspace]
members = ["crates/base", "crates/testkit"]

[dependencies]
serde_json = "1"
wsp-base = { path = "crates/base" }

[dev-dependencies]
wsp-testkit = { path = "crates/testkit" }
wsp-base = { path = "crates/base", features = ["test-support"] }

[profile.release]
opt-level = 2
lto = false
strip = true
codegen-units = 16
