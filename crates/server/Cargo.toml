[package]
name = "wsp-server"
version = "0.1.0"
edition = "2021"
description = "The state core's server (docs/state-core.md section 6), step 1's part: the read verbs and subscribe on TCP over any dyn Store, and the mirror domain"

[lib]
path = "src/lib.rs"

[dependencies]
# Frames are lines of JSON; a mirrored entity is an event's JSON payload.
serde_json = "1"
wsp-api = { path = "../api" }
wsp-store-contract = { path = "../store-contract" }

[dev-dependencies]
# MemStore, for the tests' server, and nothing of a backend (section 6).
wsp-store-conformance = { path = "../store-conformance" }
