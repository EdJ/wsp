[package]
name = "wsp-server"
version = "0.1.0"
edition = "2021"
description = "The state core's server (docs/state-core.md section 6): the read verbs and subscribe on TCP over any dyn Store, the mirror domain, and from step 2 the orders machine composed beside it with its commands"

[lib]
path = "src/lib.rs"

[dependencies]
# Frames are lines of JSON; a mirrored entity is an event's JSON payload.
serde_json = "1"
wsp-api = { path = "../api" }
# Step 2: the orders machine, composed beside the mirror (src/domain.rs).
wsp-machines = { path = "../machines" }
wsp-store-contract = { path = "../store-contract" }

# TLS (wsp-461): the hub'"'"'s listener. The ring provider, named explicitly where a config is built, so
# no process-wide default is installed.
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
# A generated CA and a certificate for `localhost`, for the tests of whatever serves or dials TLS
# (`testing`, behind `test-support`).
rcgen = { version = "0.14", optional = true }

[features]
test-support = ["dep:rcgen"]

[dev-dependencies]
wsp-server = { path = ".", features = ["test-support"] }
# MemStore, for the tests' server, and nothing of a backend (section 6).
wsp-store-conformance = { path = "../store-conformance" }
