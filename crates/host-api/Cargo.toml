[package]
name = "wsp-host-api"
version = "0.1.0"
edition = "2021"
description = "The agent manager's protocol (docs/agent-manager.md section 3): message types, the idempotency key and seat epoch, and the Connection trait; no IO, no logic"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
# Only the in-memory pair encodes; the types themselves need serde alone.
serde_json = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"

[features]
# The in-memory `Connection` pair, for the tests of whatever speaks the protocol.
test-support = ["dep:serde_json"]
