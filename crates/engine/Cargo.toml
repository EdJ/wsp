[package]
name = "wsp-engine"
version = "0.1.0"
edition = "2021"
description = "wsp's engine and seats: the run (worklist, cycle, repair, verification, legs, the barrier), the row and list verbs, and the seat commands"

[lib]
path = "src/lib.rs"
# Its doc blocks are prose and never ran as doctests while these modules were the bin's (wsp-440).
doctest = false

[dependencies]
serde_json = "1"
wsp-base = { path = "../base" }
wsp-store = { path = "../store" }
wsp-wire = { path = "../wire" }
wsp-trees = { path = "../trees" }
wsp-host-api = { path = "../host-api" }
wsp-store-contract = { path = "../store-contract" }
wsp-objects = { path = "../objects" }
wsp-server = { path = "../server" }
wsp-api = { path = "../api" }
wsp-client = { path = "../client" }
wsp-view = { path = "../view" }
# `token::mint`, the hash a hub token record keeps (cmd_hub, wsp-163).
wsp-machines = { path = "../machines" }

[dev-dependencies]
wsp-base = { path = "../base", features = ["test-support"] }
wsp-client = { path = "../client", features = ["test-support"] }
wsp-store = { path = "../store", features = ["test-support"] }
wsp-wire = { path = "../wire", features = ["test-support"] }
wsp-trees = { path = "../trees", features = ["test-support"] }
wsp-server = { path = "../server", features = ["test-support"] }
wsp-testkit = { path = "../testkit" }
wsp-manager = { path = "../manager" }
# repair's reseat test posts its played hook's turn to the manager, as a real hook does.
wsp-host = { path = "../host" }
# The login tests (wsp-462) log in to a real hub over TLS: its library, a user and token made as its host makes them.
wsp-hub = { path = "../hub" }
# orders, fold and mirror tests open a real state.db, as the daemon does (tests only; the binary alone links it).
wsp-store-sqlite = { path = "../store-sqlite" }

[features]
# What a dependent's tests need of engine's: the fixtures, the recorders and `base::under_test` (wsp-544).
test-support = [
    "wsp-base/test-support",
    "wsp-client/test-support",
    "wsp-store/test-support",
    "wsp-wire/test-support",
    "wsp-trees/test-support",
    "wsp-server/test-support",
]

# A dependent's view of engine; the root's dev-dependency turns the feature on in a workspace run.
[[test]]
name = "dependent"
required-features = ["test-support"]
