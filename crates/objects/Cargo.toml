[package]
name = "wsp-objects"
version = "0.1.0"
edition = "2021"
description = "The hub's object format: immutable records and events named by the SHA-256 of their canonical JSON, and the refs that name each subject's head; pure, no IO, no clock"

[lib]
path = "src/lib.rs"

[dependencies]
wsp-store-contract = { path = "../store-contract" }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
