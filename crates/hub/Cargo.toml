[package]
name = "wsp-hub"
version = "0.1.0"
edition = "2021"
description = "The hub (wsp-460): objects in a directory keyed by hash, refs and leases in one small SQLite through wsp-store-sqlite, served on wsp-server's carrier as the wsp-hub binary; no agents, builds or worktrees"

[lib]
path = "src/lib.rs"

[[bin]]
name = "wsp-hub"
path = "src/main.rs"

[dependencies]
wsp-api = { path = "../api" }
wsp-objects = { path = "../objects" }
# The identity machine (wsp-159), the hub's domain, and its token hash (wsp-161).
wsp-machines = { path = "../machines" }
# The carrier, the connection loop and subscribe, which the hub serves its verbs on.
wsp-server = { path = "../server" }
wsp-store-contract = { path = "../store-contract" }
wsp-store-sqlite = { path = "../store-sqlite" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# A generated CA and a certificate for `localhost` (`wsp_server::testing`).
wsp-server = { path = "../server", features = ["test-support"] }
# The tests' two clients dial the served hub as a spoke does.
wsp-client = { path = "../client" }
