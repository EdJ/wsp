[package]
name = "wsp-client"
version = "0.1.0"
edition = "2021"
description = "The state core's client (docs/state-core.md section 6), step 1's part: dial and hello, request, and subscribe with reconnect, for the CLI and web-chrome"

[lib]
path = "src/lib.rs"

[dependencies]
# Frames are lines of JSON, and `api.json` is read as one.
serde_json = "1"
wsp-api = { path = "../api" }
wsp-store-contract = { path = "../store-contract" }
# The sync verbs' ids and refs, and `verify` and `diff` (wsp-459); pure, no IO.
wsp-objects = { path = "../objects" }

# TLS (wsp-461): a hub URL of `tls://` is dialled over it, with the platform's roots or a pinned CA.
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-native-certs = "0.8"

[features]
# `testing`: an in-memory hub that answers the sync verbs, for the tests of whatever syncs.
test-support = []

[dev-dependencies]
# The tests use `testing`, which is behind `test-support`.
wsp-client = { path = ".", features = ["test-support"] }
# The tests' loopback server and its in-memory store; never a normal dependency, so that
# web-chrome links no more of wsp than the protocol (tests/layering.rs).
wsp-server = { path = "../server", features = ["test-support"] }
wsp-store-conformance = { path = "../store-conformance" }
