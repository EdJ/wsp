[package]
name = "wsp-store-contract"
version = "0.1.0"
edition = "2021"
description = "wsp-store's contract: its constants, and the state core's types and Store trait family (docs/state-core.md 2.2); no logic, no IO"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
# An event's payload is a JSON value.
serde_json = "1"
