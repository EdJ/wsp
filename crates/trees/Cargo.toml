[package]
name = "wsp-trees"
version = "0.1.0"
edition = "2021"
description = "wsp's trees: checkout, verify, treecopy, check_tree, throttle, warm, overlap, guard, greens, at_stop, gc"

[lib]
path = "src/lib.rs"

[dependencies]
serde_json = "1"
wsp-base = { path = "../base" }
wsp-store = { path = "../store" }
wsp-wire = { path = "../wire" }
# throttle --json's projection (wsp-305).
wsp-view = { path = "../view" }

[dev-dependencies]
wsp-base = { path = "../base", features = ["test-support"] }
wsp-store = { path = "../store", features = ["test-support"] }
wsp-wire = { path = "../wire", features = ["test-support"] }
wsp-testkit = { path = "../testkit" }

[features]
test-support = []
