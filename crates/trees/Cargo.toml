[package]
name = "wsp-trees"
version = "0.1.0"
edition = "2021"
description = "wsp's trees: checkout, verify, treecopy, check_tree, throttle, warm, overlap, guard, greens, at_stop, gc"

[lib]
path = "src/lib.rs"

[dependencies]
serde_json = "1"
wsp-base = { path = "../base" }
wsp-store = { path = "../store" }
wsp-wire = { path = "../wire" }
# throttle run's jobs and the beat's facts it decides on (wsp-052).
wsp-host-api = { path = "../host-api" }
# the jobs a process runs on wsp-host's runner (WSP_JOBS=inproc), which the leftover sweep spares (wsp-444).
wsp-host = { path = "../host" }
# throttle --json's projection (wsp-305).
wsp-view = { path = "../view" }

[dev-dependencies]
wsp-base = { path = "../base", features = ["test-support"] }
wsp-store = { path = "../store", features = ["test-support"] }
wsp-wire = { path = "../wire", features = ["test-support"] }
wsp-testkit = { path = "../testkit" }
# throttle run's tests (wsp-052) and verify's jobs (wsp-054) stand a loopback manager up.
wsp-manager = { path = "../manager" }

[features]
test-support = []
