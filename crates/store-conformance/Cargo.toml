[package]
name = "wsp-store-conformance"
version = "0.1.0"
edition = "2021"
description = "The state store's conformance suite (docs/state-core.md 2.3), generic over a harness, and MemStore, the in-memory fake it first runs against"

[lib]
path = "src/lib.rs"

[dependencies]
# Section 6: the contract, and `wsp-testkit` when a case needs it; nothing else of the workspace
# (tests/layering.rs). No case needs the test kit yet, and cargo warns on an unused dependency.
wsp-store-contract = { path = "../store-contract" }
# An event's payload is a `serde_json::Value` (the contract's own dependency, not a new one).
serde_json = "1"
