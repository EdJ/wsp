# Every rustc goes through `.cargo/rustc-wrap`: sccache if installed, bare rustc if not.
[build]
rustc-wrapper = ".cargo/rustc-wrap"

# wsp-539: on an Intel Mac `ld` does not ad-hoc sign what it links (Apple Silicon's does), and
# `taskgated` then checks each unsigned test process as nextest starts it, about 2,900 per full
# run. `-adhoc_codesign` signs at link: a full `cargo nextest run --workspace` costs `taskgated`
# 11.5 CPU-seconds instead of 50.6 (4.4x), and runs a little faster. `wsp install` signs a release
# build again with `codesign --force`, which replaces this signature. Measured in the row's note.
# Not for `aarch64-apple-darwin`, which signs already. An explicit RUSTFLAGS in the environment
# replaces this (cargo takes one source of rustflags), so nothing here sets one.
[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-adhoc_codesign"]

# wsp-548: every test process runs with a TMPDIR of its own that is removed after it, so a test's
# scratch goes under `std::env::temp_dir()` and nowhere else.
[target.'cfg(unix)']
runner = ".cargo/test-run"

# State-core step 0 (docs/state-core.md section 9): C compiled by a build script (libsqlite3-sys's
# sqlite3.c) goes through `.cargo/cc-wrap`, sccache's `cc` when installed, bare `cc` when not.
# No `force`: a CC in the environment still wins. `relative` makes the path absolute from this file.
[env]
CC = { value = ".cargo/cc-wrap", relative = true }
